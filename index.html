<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sunset Hunter 🌅</title>
<style>
:root {
  --bg: #0f0e17;
  --bg-card: #1a1825;
  --bg-card-2: #221f30;
  --text: #f5f0eb;
  --text-muted: #a89f96;
  --accent: #ff7a3d;
  --accent-2: #ff4d6a;
  --accent-soft: rgba(255,122,61,.15);
  --sunrise: #ffb347;
  --sunset: #ff5c7a;
  --border: rgba(255,255,255,.08);
  --radius: 18px;
  --shadow: 0 8px 32px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -20%,rgba(255,100,50,.18),transparent),
    radial-gradient(ellipse 60% 40% at 100% 0%,rgba(255,60,100,.08),transparent);
}
.wrap{max-width:920px;margin:0 auto;padding:24px 18px 60px}
header{text-align:center;padding:28px 0 20px}
header h1{
  font-size:2.1rem;font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(135deg,#ffb347,#ff7a3d 40%,#ff4d6a);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px;
}
.sub{color:var(--text-muted);font-size:.95rem;max-width:520px;margin:0 auto}
.card{
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;margin:16px 0;box-shadow:var(--shadow);
}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select{
  font:inherit;padding:12px 14px;border:1px solid var(--border);border-radius:12px;
  background:var(--bg-card-2);color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s;
}
input{flex:1;min-width:200px}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input::placeholder{color:#6b6560}
button{
  font:inherit;padding:12px 18px;border:none;border-radius:12px;cursor:pointer;font-weight:650;
  background:linear-gradient(135deg,#ff8a3d,#ff5c5c);color:#fff;
  transition:transform .15s,box-shadow .15s;box-shadow:0 4px 14px rgba(255,90,50,.3);
}
button:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(255,90,50,.4)}
button.secondary{background:transparent;color:var(--text);border:1px solid var(--border);box-shadow:none}
button.secondary:hover{background:var(--bg-card-2);border-color:rgba(255,255,255,.15)}
label{display:flex;align-items:center;gap:8px;color:var(--text-muted);font-size:.9rem}
#status{margin-top:14px;color:var(--text-muted);font-size:.88rem}
.candidates{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.cand{
  display:flex;justify-content:space-between;align-items:center;padding:12px 14px;
  background:var(--bg-card-2);border-radius:12px;cursor:pointer;border:1px solid transparent;transition:.2s;
}
.cand:hover{border-color:var(--accent);background:rgba(255,122,61,.08)}
.cand b{font-size:.95rem}.cand span{font-size:.8rem;color:var(--text-muted)}

/* Dual score cards */
.dual-scores{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:4px}
.score-card{
  background:var(--bg-card-2);border:1px solid var(--border);border-radius:14px;padding:18px;text-align:center;
}
.score-card.sunrise{border-color:rgba(255,179,71,.25)}
.score-card.sunset{border-color:rgba(255,92,122,.25)}
.score-card .label{font-size:.78rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.score-card .num{
  font-size:2.8rem;font-weight:850;line-height:1;
  background:linear-gradient(160deg,#ffb347,#ff6b4a,#ff3d6a);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.score-card.sunrise .num{background:linear-gradient(160deg,#ffe08a,#ffb347,#ff8a3d);-webkit-background-clip:text;background-clip:text}
.score-card.sunset .num{background:linear-gradient(160deg,#ff9a6a,#ff5c7a,#ff3d6a);-webkit-background-clip:text;background-clip:text}
.score-card .verdict{font-weight:700;margin-top:6px;font-size:.95rem;color:var(--accent)}
.score-card .time{font-size:.85rem;color:var(--text-muted);margin-top:4px}
.place-name{font-size:1.2rem;font-weight:700;margin:14px 0 8px;text-align:center}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.metric{background:var(--bg-card-2);border-radius:12px;padding:12px;border:1px solid var(--border)}
.metric span{font-size:.75rem;color:var(--text-muted);display:block}
.metric b{display:block;font-size:1.1rem;margin-top:4px;font-weight:700}

table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:11px 6px;border-bottom:1px solid var(--border)}
th{font-size:.75rem;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
td{font-size:.92rem}
.top{font-weight:800;color:var(--accent)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}

.solar-badge{font-size:.9rem;color:var(--text-muted);margin-bottom:10px}
.solar-badge b{color:var(--text)}
#solarMap{height:340px;border-radius:14px;background:#12101a;border:1px solid var(--border)}
.solar-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.solar-metric{background:var(--bg-card-2);border-radius:12px;padding:12px;border:1px solid var(--border)}
.solar-metric span{display:block;font-size:.75rem;color:var(--text-muted)}
.solar-metric b{display:block;font-size:1rem;margin-top:4px}
.solar-note{margin-top:14px;font-size:.82rem;color:var(--text-muted);line-height:1.55}

.tip{line-height:1.65;color:var(--text-muted);font-size:.92rem}
.tip b{color:var(--text)}
.photo-tips h3{font-size:1rem;margin-bottom:10px;color:var(--text)}
.photo-tips ul{padding-left:18px;margin:8px 0}
.photo-tips li{margin-bottom:6px;font-size:.9rem;color:var(--text-muted)}
.photo-tips .settings{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:12px 0;
}
.photo-tips .set-item{
  background:var(--bg-card-2);border-radius:10px;padding:10px 12px;border:1px solid var(--border);font-size:.85rem;
}
.photo-tips .set-item b{display:block;color:var(--accent);font-size:.78rem;margin-bottom:2px}

#langScreen{
  position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;
  background-image:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(255,100,50,.2),transparent);
}
.lang-card{
  background:var(--bg-card);border:1px solid var(--border);border-radius:24px;padding:36px 28px;
  max-width:400px;width:100%;text-align:center;box-shadow:var(--shadow);
}
.lang-card .emoji{font-size:3.2rem;margin-bottom:8px}
.lang-card h1{
  font-size:1.7rem;margin-bottom:8px;
  background:linear-gradient(135deg,#ffb347,#ff7a3d,#ff4d6a);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.lang-card p{color:var(--text-muted);margin-bottom:24px;font-size:.95rem}
.lang-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.lang-btns button{
  min-width:130px;background:var(--bg-card-2);border:1px solid var(--border);box-shadow:none;color:var(--text);
}
.lang-btns button:hover{border-color:var(--accent);background:rgba(255,122,61,.12)}

@media(max-width:650px){
  header h1{font-size:1.7rem}
  .dual-scores{grid-template-columns:1fr}
  .score-card .num{font-size:2.4rem}
  .grid{grid-template-columns:repeat(2,1fr)}
  th:nth-child(n+5),td:nth-child(n+5){display:none}
  #solarMap{height:260px}
}
</style>

<body>
<div id="langScreen">
  <div class="lang-card">
    <div class="emoji">🌅</div>
    <h1>Sunset Hunter</h1>
    <p>Choose your language<br>選擇你的語言</p>
    <div class="lang-btns">
      <button onclick="setLang('en')">🇬🇧 English</button>
      <button onclick="setLang('zh')">🇹🇼 繁體中文</button>
    </div>
  </div>
</div>

<div class="wrap">
  <header>
    <h1 id="title">🌅 Sunset Hunter</h1>
    <p id="subtitle" class="sub">Sunrise & sunset color prediction — find the best chance of dramatic skies.</p>
  </header>

  <div class="card">
    <div class="controls">
      <input id="place" placeholder="Search any city or place, e.g. Taipei, London, Tokyo" autocomplete="off">
      <button id="search">Search</button>
      <button id="locate" class="secondary">Use my location</button>
    </div>

    <div style="height:14px"></div>

          <option value="3">Next 3 days</option>

    <div id="photoContent"></div>
  </div>
</div>

<script>
let lang = localStorage.getItem("sunsetHunterLang") || null;
const T = {
  en: {

    search:"Search",locate:"Use my location",date:"From",forecast:"Forecast",
    d3:"Next 3 days",d7:"Next 7 days",start:"Search for a city to begin.",
    score:"Score",best:"BEST DAY",sunset:"Sunset",sunrise:"Sunrise",
    high:"High cloud",mid:"Mid cloud",low:"Low cloud",rain:"Rain chance",vis:"Visibility",hum:"Humidity",
    excellent:"Exceptional 🔥",very:"Excellent ⭐",promising:"Very promising 👍",possible:"Possible",lowchance:"Low chance",
    how:"How the score works",
    tip:"The model looks for a useful combination of <b>high and middle cloud</b> (the best canvas) and rewards when both layers are present. It penalizes excessive low cloud and rain, while factoring in visibility and moderate humidity. Applied separately to sunrise and sunset times. Result is a <b>0–100 Score</b> — not a guarantee.",
    loading:"Loading forecast…",finding:"Finding place…",notfound:"Place not found.",fail:"Could not load the forecast.",
    sunsetDir:"Sunset direction",sunriseDir:"Sunrise direction",solarNoon:"Solar noon",elevation:"Elevation",
    solarAlt:"Solar altitude",viewDir:"Best viewing direction",horizon:"Horizon",
    openSky:"Open horizon (terrain DEM not loaded)",
    solarNote:"Solar position is calculated locally. The map contains no weather layer.",
    solarHint:"Sunrise / sunset direction and solar path",
    today:"Today",tomorrow:"Tomorrow",pick:"Select a location",
    rank:"Rank",dateCol:"Date",verdict:"Verdict",
    sunriseScore:"Sunrise Score",sunsetScore:"Sunset Score",
    photoTitle:"📸 Photography Tips",
    photoBody:`
      <p style="margin-bottom:10px;color:var(--text-muted);font-size:.9rem">Golden hour ≈ first 45–60 min after sunrise / last 45–60 min before sunset.</p>
      <div class="settings">
        <div class="set-item"><b>ISO</b>100–400 (tripod: 100)</div>
        <div class="set-item"><b>Aperture</b>f/8–f/11 landscape · f/1.8–f/4 portrait</div>
        <div class="set-item"><b>Shutter</b>1/125+ handheld · slower on tripod</div>
        <div class="set-item"><b>White Balance</b>Cloudy / Shade (warm tones)</div>
        <div class="set-item"><b>Format</b>RAW always</div>
        <div class="set-item"><b>Exposure</b>−0.3 to −1 EV (protect sky)</div>
      </div>
      <ul>
        <li><b>Arrive early</b> — be on location 20–30 min before sunrise / sunset.</li>
        <li><b>Composition</b> — rule of thirds; put horizon on lower or upper third. Use foreground (rocks, water, trees) for depth.</li>
        <li><b>Silhouette</b> — expose for the sky; let subjects go dark against the color.</li>
        <li><b>Starburst</b> — small aperture (f/16) + sun just at edge of frame.</li>
        <li><b>Stay longer</b> — best color often peaks 10–20 min after the sun dips / rises.</li>
        <li><b>Phone tip</b> — use HDR or Pro mode, lock exposure on the bright sky, then recompose.</li>
      </ul>`
  },
  zh: {
    title:"🌅 晚霞獵人",
    sub:"日出與晚霞預測——尋找最有機會出現粉紅、橘紅與壯觀天空的地方。",
    search:"搜尋",locate:"使用我的位置",date:"起始日期",forecast:"預測天數",
    d3:"未來 3 天",d7:"未來 7 天",start:"請搜尋一個城市開始。",
    score:"指數",best:"最佳預測日",sunset:"日落",sunrise:"日出",
    high:"高雲",mid:"中雲",low:"低雲",rain:"降雨機率",vis:"能見度",hum:"濕度",
    excellent:"極佳 🔥",very:"非常值得 ⭐",promising:"很有機會 👍",possible:"有機會",lowchance:"機會偏低",
    how:"指數怎麼算？",
    tip:"模型會尋找適量的<b>高雲與中雲</b>（最佳畫布），並在兩者同時出現時額外加分。同時降低低雲與降雨的遮蔽影響，也會考慮能見度與適中濕度。日出與日落分別計算。結果是 <b>0～100 指數</b>，不是保證。",
    loading:"正在載入預報……",finding:"正在尋找地點……",notfound:"找不到這個地點。",fail:"無法取得預報。",
    sunsetDir:"日落方向",sunriseDir:"日出方向",solarNoon:"太陽正午",elevation:"海拔",
    solarAlt:"太陽高度角",viewDir:"最佳觀看方向",horizon:"地平線",
    openSky:"開闊地平線（尚未載入地形 DEM）",
    solarNote:"太陽位置由本地計算；地圖不含氣象圖層。",
    solarHint:"日出／日落方向與太陽路徑",
    today:"今天",tomorrow:"明天",pick:"請選擇地點",
    rank:"排名",dateCol:"日期",verdict:"評價",
    sunriseScore:"日出指數",sunsetScore:"晚霞指數",
    photoTitle:"📸 攝影技巧",
    photoBody:`
      <p style="margin-bottom:10px;color:var(--text-muted);font-size:.9rem">黃金時刻 ≈ 日出後 45–60 分鐘 / 日落前 45–60 分鐘。</p>
      <div class="settings">
        <div class="set-item"><b>ISO</b>100–400（腳架可鎖 100）</div>
        <div class="set-item"><b>光圈</b>風景 f/8–f/11 · 人像 f/1.8–f/4</div>
        <div class="set-item"><b>快門</b>手持 ≥1/125 · 腳架可更慢</div>
        <div class="set-item"><b>白平衡</b>陰天 / 陰影（偏暖）</div>
        <div class="set-item"><b>格式</b>一律拍 RAW</div>
        <div class="set-item"><b>曝光</b>−0.3～−1 EV（保護天空）</div>
      </div>
      <ul>
        <li><b>提早到場</b> — 日出／日落前 20–30 分鐘就定位好。</li>
        <li><b>構圖</b> — 三分法，地平線放在上或下 1/3。用前景（礁石、水面、樹木）增加層次。</li>
        <li><b>剪影</b> — 對天空測光，讓主體變成深色輪廓。</li>
        <li><b>星芒</b> — 小光圈 f/16，太陽剛擦到畫面邊緣。</li>
        <li><b>多待一會兒</b> — 最美的顏色常出現在太陽升起／落下後 10–20 分鐘。</li>
        <li><b>手機技巧</b> — 開 HDR 或專業模式，先對亮部天空鎖定曝光再構圖。</li>
      </ul>`
  }
};
function tr(k){return (T[lang||"en"]||T.en)[k]||k}

function setLang(x){
  lang=x;localStorage.setItem("sunsetHunterLang",x);
  document.getElementById("langScreen").style.display="none";
  applyLang();fillDateOptions();
  if(current) run(current);
}
function applyLang(){
  if(!lang)return;
  $("title").innerHTML=tr("title");
  $("subtitle").textContent=tr("sub");
  $("search").textContent=tr("search");
  $("locate").textContent=tr("locate");
  $("dateLabel").textContent=tr("date");
  $("daysLabel").textContent=tr("forecast");
  $("days").options[0].text=tr("d3");
  $("days").options[1].text=tr("d7");
  $("howTitle").textContent=tr("how");
  $("tipText").innerHTML=tr("tip");
  $("solarMapHint").textContent=tr("solarHint");
  $("photoTitle").textContent=tr("photoTitle");
  $("photoContent").innerHTML=tr("photoBody");
  if(!current)$("status").textContent=tr("start");
  $("place").placeholder=lang==="zh"?"搜尋城市或地點，例如：台北、倫敦、東京":"Search any city or place, e.g. Taipei, London, Tokyo";
}

const $=id=>document.getElementById(id);
const today=new Date();today.setHours(0,0,0,0);
function clamp(x,a=0,b=100){return Math.max(a,Math.min(b,x))}
function ideal(v,lo,hi){
  if(v>=lo&&v<=hi)return 100;
  if(v<lo)return clamp(100-(lo-v)*2);
  return clamp(100-(v-hi)*2);
}

function skyScore(w){
  const high=ideal(w.high,25,70);
  const mid=ideal(w.mid,15,55);
  const interact=Math.sqrt((high/100)*(mid/100))*100;
  const low=100-clamp(Math.max(0,w.low-25)*2.2);
  const rain=100-clamp(w.pop*1.3);
  const vis=ideal(w.vis/1000,7,28);
  const hum=ideal(w.hum,40,72);
  const raw=high*.27+mid*.15+interact*.15+low*.16+rain*.12+vis*.10+hum*.05;
  return Math.round(clamp(raw));
}
function verdict(s){
  if(s>=88)return tr("excellent");
  if(s>=78)return tr("very");
  if(s>=68)return tr("promising");
  if(s>=55)return tr("possible");
  return tr("lowchance");
}
function nearestIndex(times,target){
  let bi=0,bd=Infinity;
  for(let i=0;i<times.length;i++){
    const d=Math.abs(new Date(times[i])-target);
    if(d<bd){bd=d;bi=i}
  }
  return bi;
}
function fillDateOptions(){
  const sel=$("date");sel.innerHTML="";
  for(let i=0;i<7;i++){
    const d=new Date(today);d.setDate(d.getDate()+i);
    const s=d.toISOString().slice(0,10);
    const o=document.createElement("option");
    o.value=s;o.textContent=i===0?tr("today"):i===1?tr("tomorrow"):s;
    sel.appendChild(o);
  }
}

async function geocode(q){
  const u="https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(q)+"&count=8&language="+(lang||"en")+"&format=json";
  const j=await fetch(u).then(r=>r.json());
  if(!j.results?.length)throw new Error("notfound");
  return j.results;
}
async function forecast(lat,lon,date){
  const u=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`+
    `&hourly=cloud_cover_low,cloud_cover_mid,cloud_cover_high,precipitation_probability,relative_humidity_2m,visibility`+
    `&daily=sunset,sunrise&timezone=auto&start_date=${date}&end_date=${date}`;
  const r=await fetch(u);
  if(!r.ok)throw new Error("fail");
  return r.json();
}
function weatherAt(j,idx){
  return {
    high:j.hourly.cloud_cover_high[idx]??0,
    mid:j.hourly.cloud_cover_mid[idx]??0,
    low:j.hourly.cloud_cover_low[idx]??0,
    pop:j.hourly.precipitation_probability[idx]??0,
    hum:j.hourly.relative_humidity_2m[idx]??0,
    vis:j.hourly.visibility[idx]??0
  };
}
async function getDay(place,date){
  const j=await forecast(place.latitude,place.longitude,date);
  const sunset=new Date(j.daily.sunset[0]);
  const sunrise=new Date(j.daily.sunrise[0]);
  const iSun=nearestIndex(j.hourly.time,sunset);
  const iRise=nearestIndex(j.hourly.time,sunrise);
  const wSun=weatherAt(j,iSun);
  const wRise=weatherAt(j,iRise);
  return {
    date,
    sunsetScore:skyScore(wSun),
    sunriseScore:skyScore(wRise),
    sunset,sunrise,
    elevation:j.elevation??0,
    wSun,wRise
  };
}

let current=null;
async function run(place){
  current=place;
  $("candidates").style.display="none";
  $("status").textContent=`${tr("loading")} ${place.name}${place.country?", "+place.country:""}`;
  $("app").innerHTML="";
  $("solarInfo").style.display="none";
  try{
    const startDate=$("date").value;
    const n=Number($("days").value);
    const start=new Date(startDate+"T12:00:00");
    const out=[];
    for(let k=0;k<n;k++){
      const d=new Date(start);d.setDate(d.getDate()+k);
      out.push(await getDay(place,d.toISOString().slice(0,10)));
    }
    // sort by max of sunrise/sunset score
    out.sort((a,b)=>Math.max(b.sunriseScore,b.sunsetScore)-Math.max(a.sunriseScore,a.sunsetScore));
    const best=out[0];
    const tzHint=best.sunset.toLocaleTimeString("en-US",{timeZoneName:"short"}).split(" ").slice(-1)[0]||"local";
    $("status").textContent=`✓ ${place.name}${place.country?", "+place.country:""} · ${place.latitude.toFixed(2)}°, ${place.longitude.toFixed(2)}° · ${tzHint}`;

    $("app").innerHTML=`
      <div class="card">
        <div class="place-name">${place.name}${place.country?", "+place.country:""}</div>
        <div class="muted" style="text-align:center;margin-bottom:12px">${tr("best")} · ${best.date}</div>
        <div class="dual-scores">
          <div class="score-card sunrise">
            <div class="label">☀️ ${tr("sunriseScore")}</div>
            <div class="num">${best.sunriseScore}</div>
            <div class="verdict">${verdict(best.sunriseScore)}</div>
            <div class="time">${fmtTime(best.sunrise)}</div>
          </div>
          <div class="score-card sunset">
            <div class="label">🌅 ${tr("sunsetScore")}</div>
            <div class="num">${best.sunsetScore}</div>
            <div class="verdict">${verdict(best.sunsetScore)}</div>
            <div class="time">${fmtTime(best.sunset)}</div>
          </div>
        </div>
        <div class="grid">
          <div class="metric"><span>${tr("high")} (↓)</span><b>${best.wSun.high}%</b></div>
          <div class="metric"><span>${tr("mid")} (↓)</span><b>${best.wSun.mid}%</b></div>
          <div class="metric"><span>${tr("low")} (↓)</span><b>${best.wSun.low}%</b></div>
          <div class="metric"><span>${tr("rain")} (↓)</span><b>${best.wSun.pop}%</b></div>
          <div class="metric"><span>${tr("vis")} (↓)</span><b>${(best.wSun.vis/1000).toFixed(1)} km</b></div>
          <div class="metric"><span>${tr("hum")} (↓)</span><b>${best.wSun.hum}%</b></div>
        </div>
        <p class="muted" style="margin-top:10px;font-size:.8rem">↓ = sunset-time values · sunrise uses its own hour</p>
      </div>
      <div class="card">
        <table>
          <thead>
            <tr>
              <th>${tr("rank")}</th>
              <th>${tr("dateCol")}</th>
              <th>☀️ ${tr("sunrise")}</th>
              <th>🌅 ${tr("sunset")}</th>
              <th>${tr("verdict")}</th>
            </tr>
          </thead>
          <tbody>
            ${out.map((x,i)=>`
              <tr>
                <td class="top">${i+1}</td>
                <td>${x.date}</td>
                <td class="top">${x.sunriseScore}</td>
                <td class="top">${x.sunsetScore}</td>
                <td>${verdict(Math.max(x.sunriseScore,x.sunsetScore))}</td>
              </tr>`).join("")}
          </tbody>
        </table>
      </div>`;
    drawSolarMap(place,best);
  }catch(e){
    console.error(e);
    $("status").textContent=tr("fail");
  }
}

async function doSearch(){
  const q=$("place").value.trim();
  if(!q)return;
  $("status").textContent=tr("finding");
  $("candidates").style.display="none";
  try{
    const results=await geocode(q);
    if(results.length===1)run(results[0]);
    else showCandidates(results);
  }catch(e){$("status").textContent=tr("notfound")}
}
function showCandidates(list){
  const box=$("candidates");
  box.innerHTML=`<div class="muted" style="margin-bottom:6px">${tr("pick")}</div>`;
  list.forEach(p=>{
    const div=document.createElement("div");
    div.className="cand";
    div.innerHTML=`<div><b>${p.name}</b><br><span>${[p.admin1,p.country].filter(Boolean).join(", ")}</span></div>
                   <span>${p.latitude.toFixed(2)}°, ${p.longitude.toFixed(2)}°</span>`;
    div.onclick=()=>run(p);
    box.appendChild(div);
  });
  box.style.display="flex";
  $("status").textContent=`${list.length} places found`;
}
$("search").onclick=doSearch;
$("place").addEventListener("keydown",e=>{if(e.key==="Enter")doSearch()});
$("days").onchange=()=>current&&run(current);
$("date").onchange=()=>current&&run(current);
$("locate").onclick=()=>{
  if(!navigator.geolocation){$("status").textContent=tr("fail");return}
  $("status").textContent=tr("finding");
  navigator.geolocation.getCurrentPosition(
    p=>run({name:lang==="zh"?"我的位置":"Your location",country:"",latitude:p.coords.latitude,longitude:p.coords.longitude}),
    ()=>{$("status").textContent=lang==="zh"?"無法取得位置權限":"Location permission denied"}
  );
};

/* Solar map */
let solarMap=null,solarLayers=[];
function rad(d){return d*Math.PI/180} function deg(r){return r*180/Math.PI}
function clampN(x,a,b){return Math.max(a,Math.min(b,x))}
function julianDay(date){return date.getTime()/86400000+2440587.5}
function solarPosition(date,lat,lon){
  const jd=julianDay(date),T=(jd-2451545.0)/36525;
  let L0=(280.46646+T*(36000.76983+T*0.0003032))%360;if(L0<0)L0+=360;
  const M=357.52911+T*(35999.05029-0.0001537*T);
  const e=0.016708634-T*(0.000042037+0.0000001267*T);
  const C=(1.914602-T*(0.004817+0.000014*T))*Math.sin(rad(M))+(0.019993-0.000101*T)*Math.sin(rad(2*M))+0.000289*Math.sin(rad(3*M));
  const trueLong=L0+C,omega=125.04-1934.136*T;
  const lambda=trueLong-0.00569-0.00478*Math.sin(rad(omega));
  const eps0=23+(26+((21.448-T*(46.815+T*(0.00059-T*0.001813)))/60))/60;
  const eps=eps0+0.00256*Math.cos(rad(omega));
  const decl=deg(Math.asin(Math.sin(rad(eps))*Math.sin(rad(lambda))));
  const y=Math.tan(rad(eps/2));
  const eq=4*deg(y*y*Math.sin(2*rad(L0))-2*e*Math.sin(rad(M))+4*e*y*y*Math.sin(rad(M))*Math.cos(2*rad(L0))-0.5*y**4*Math.sin(4*rad(L0))-1.25*e*e*Math.sin(2*rad(M)));
  const off=date.getTimezoneOffset();
  const mins=date.getHours()*60+date.getMinutes()+date.getSeconds()/60;
  const tst=(mins+eq+4*lon-off)%1440;
  let ha=tst/4-180;if(ha<-180)ha+=360;
  const zen=deg(Math.acos(clampN(Math.sin(rad(lat))*Math.sin(rad(decl))+Math.cos(rad(lat))*Math.cos(rad(decl))*Math.cos(rad(ha)),-1,1)));
  const elevation=90-zen;
  let az=deg(Math.atan2(Math.sin(rad(ha)),Math.cos(rad(ha))*Math.sin(rad(lat))-Math.tan(rad(decl))*Math.cos(rad(lat))))+180;
  az=(az+360)%360;
  return{azimuth:az,elevation,declination:decl};
}
function bearingName(a){
  if(lang==="zh"){const dirs=["北","北東","東","南東","南","南西","西","北西"];return dirs[Math.round(a/45)%8]}
  const dirs=["N","NE","E","SE","S","SW","W","NW"];return dirs[Math.round(a/45)%8];
}
function destination(lat,lon,bearing,km){
  const R=6371,br=rad(bearing),la=rad(lat),lo=rad(lon),d=km/R;
  const nla=Math.asin(Math.sin(la)*Math.cos(d)+Math.cos(la)*Math.sin(d)*Math.cos(br));
  const nlo=lo+Math.atan2(Math.sin(br)*Math.sin(d)*Math.cos(la),Math.cos(d)-Math.sin(la)*Math.sin(nla));
  return[deg(nla),((deg(nlo)+540)%360)-180];
}
function fmtTime(d){return d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}
function initSolarMap(){
  if(!window.L||solarMap)return;
  solarMap=L.map("solarMap",{zoomControl:true,attributionControl:true}).setView([23.7,121],7);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{maxZoom:19,attribution:"© OpenStreetMap © CARTO"}).addTo(solarMap);
}
function clearSolar(){solarLayers.forEach(x=>solarMap.removeLayer(x));solarLayers=[]}
function drawSolarMap(place,day){
  initSolarMap();if(!solarMap)return;clearSolar();
  const lat=Number(place.latitude),lon=Number(place.longitude);
  const sunset=day.sunset,sunrise=day.sunrise;
  const sr=solarPosition(sunrise,lat,lon),ss=solarPosition(sunset,lat,lon);
  const noon=new Date((sunrise.getTime()+sunset.getTime())/2),np=solarPosition(noon,lat,lon);
  solarMap.setView([lat,lon],9);
  const observer=L.circleMarker([lat,lon],{radius:8,color:"#fff",weight:3,fillColor:"#ff7a3d",fillOpacity:1}).addTo(solarMap);
  observer.bindTooltip(`${place.name||"Location"}<br>${lat.toFixed(3)}°, ${lon.toFixed(3)}°`,{permanent:true,direction:"top",offset:[0,-8]});
  solarLayers.push(observer);
  const srEnd=destination(lat,lon,sr.azimuth,80),ssEnd=destination(lat,lon,ss.azimuth,80);
  solarLayers.push(
    L.polyline([[lat,lon],srEnd],{color:"#ffd84d",weight:4,dashArray:"10 8"}).addTo(solarMap),
    L.polyline([[lat,lon],ssEnd],{color:"#ff7145",weight:4,dashArray:"10 8"}).addTo(solarMap)
  );
  const path=[];
  for(let t=sunrise.getTime();t<=sunset.getTime();t+=15*60000){
    const d=new Date(t),p=solarPosition(d,lat,lon);
    if(p.elevation>-1)path.push(destination(lat,lon,p.azimuth,Math.min(110,35+Math.max(0,p.elevation)*0.75)));
  }
  solarLayers.push(L.polyline(path,{color:"#b8d6ea",weight:2.5,dashArray:"5 7",opacity:.9}).addTo(solarMap));
  const sun1=L.circleMarker(srEnd,{radius:9,color:"#ffd84d",fillColor:"#ffd84d",fillOpacity:1,weight:2}).addTo(solarMap);
  const sun2=L.circleMarker(ssEnd,{radius:10,color:"#ff9a4d",fillColor:"#ff8a3d",fillOpacity:1,weight:2}).addTo(solarMap);
  sun1.bindTooltip(`☀️ ${tr("sunrise")} ${fmtTime(sunrise)}<br>${sr.azimuth.toFixed(1)}° (${bearingName(sr.azimuth)})`,{permanent:true,direction:"right"});
  sun2.bindTooltip(`🌅 ${tr("sunset")} ${fmtTime(sunset)}<br>${ss.azimuth.toFixed(1)}° (${bearingName(ss.azimuth)})`,{permanent:true,direction:"left"});
  solarLayers.push(sun1,sun2);
  const info=$("solarInfo");info.style.display="block";
  info.innerHTML=`
    <div class="solar-grid">
      <div class="solar-metric"><span>${tr("sunrise")}</span><b>${fmtTime(sunrise)}</b></div>
      <div class="solar-metric"><span>${tr("sunset")}</span><b>${fmtTime(sunset)}</b></div>
      <div class="solar-metric"><span>${tr("sunriseDir")}</span><b>${sr.azimuth.toFixed(1)}° ${bearingName(sr.azimuth)}</b></div>
      <div class="solar-metric"><span>${tr("sunsetDir")}</span><b>${ss.azimuth.toFixed(1)}° ${bearingName(ss.azimuth)}</b></div>
      <div class="solar-metric"><span>${tr("solarNoon")}</span><b>${fmtTime(noon)}</b></div>
      <div class="solar-metric"><span>${tr("solarAlt")} (${tr("solarNoon")})</span><b>${np.elevation.toFixed(1)}°</b></div>
      <div class="solar-metric"><span>${tr("elevation")}</span><b>${Number(day.elevation||0).toFixed(0)} m</b></div>
      <div class="solar-metric"><span>${tr("viewDir")}</span><b>${bearingName(ss.azimuth)} ${ss.azimuth.toFixed(0)}°</b></div>
    </div>
    <div class="solar-note">${tr("solarNote")} ${tr("horizon")}: ${tr("openSky")}</div>`;
}

if(lang)document.getElementById("langScreen").style.display="none";
fillDateOptions();applyLang();
setTimeout(initSolarMap,300);
